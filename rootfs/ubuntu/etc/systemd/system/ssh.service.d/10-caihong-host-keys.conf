#
# The image deliberately ships no SSH host keys: every device built from the same
# release must generate its own identity on first boot.
#
# Ubuntu's ssh.service runs "ExecStartPre=/usr/sbin/sshd -t" before starting the
# daemon, and sshd refuses to validate a configuration without host keys, so the
# service fails on a freshly flashed device (observed in the QEMU boot test).
# Reset the ExecStartPre list so key generation runs before the validation.
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
